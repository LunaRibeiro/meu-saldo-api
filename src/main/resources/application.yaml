spring:
  application:
    name: meu-saldo-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/meusaldo}
    username: ${DB_USER:meusaldo}
    password: ${DB_PASSWORD:meusaldo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/meu-saldo
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8081/realms/meu-saldo/protocol/openid-connect/certs}